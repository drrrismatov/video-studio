<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  * { box-sizing: border-box; }
  #stage { position: relative; overflow: hidden; font-family: 'Inter', 'DejaVu Sans', sans-serif; color: var(--fg); }
  #bg, #content, #overlay, #subs, #frame { position: absolute; inset: 0; }
  #content { display: flex; align-items: center; justify-content: center; transform-origin: 50% 50%; }
  #overlay { pointer-events: none; mix-blend-mode: screen; }
  #subs { display: flex; align-items: flex-end; justify-content: center; padding-bottom: calc(var(--u) * 6); pointer-events: none; }
  .sub { max-width: 82%; text-align: center; font-weight: 600; font-size: calc(var(--u) * 3.4); line-height: 1.3;
         color: #fff; padding: calc(var(--u)*0.8) calc(var(--u)*1.8); border-radius: calc(var(--u)*0.8);
         background: rgba(0,0,0,0.45); backdrop-filter: blur(6px); text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  .accent { color: var(--accent); }
  .accent2 { color: var(--accent2); }
  .kicker { letter-spacing: .35em; text-transform: uppercase; font-weight: 600; color: var(--accent);
            font-size: calc(var(--u)*2.0); display: flex; align-items: center; gap: calc(var(--u)*1.5); }
  .kicker .line { height: 2px; background: var(--accent); width: calc(var(--u)*6); }
  .h1 { font-family: 'Inter Display', 'Inter', sans-serif; font-weight: 800; letter-spacing: -0.03em; line-height: 1.02; }
  .glow { text-shadow: 0 0 calc(var(--u)*3) var(--glow); }
  .word { display: inline-block; white-space: pre; will-change: transform, opacity, filter; }
  .char { display: inline-block; white-space: pre; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: calc(var(--u)*1.6);
          backdrop-filter: blur(10px); }
  .muted { color: var(--muted); }
  .serif { font-family: 'DejaVu Serif', Georgia, serif; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <div id="content"></div>
  <div id="overlay"></div>
  <div id="frame"></div>
  <div id="subs"></div>
</div>
<script src="templates.js"></script>
</body>
</html>
